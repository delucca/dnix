"$schema" = 'https://starship.rs/config-schema.json'

palette = 'tokyo_night'

# Performance
scan_timeout = 30
command_timeout = 1000

# Layout: Pure-style minimal left, Jetpack-style informative right
format = """
$username$hostname$directory$git_branch$git_status$git_state
$character"""

right_format = """$cmd_duration$nodejs$python$rust$golang$docker_context$kubernetes"""

add_newline = true
continuation_prompt = '[▸ ](fg:overlay) '

# ── Prompt Character ─────────────────────────────────────────
[character]
success_symbol = '[❯](bold fg:accent)'
error_symbol = '[❯](bold fg:error)'
vimcmd_symbol = '[❮](bold fg:accent)'
vimcmd_replace_one_symbol = '[❮](bold fg:mauve)'
vimcmd_replace_symbol = '[❮](bold fg:mauve)'
vimcmd_visual_symbol = '[❮](bold fg:warning)'

# ── Directory ────────────────────────────────────────────────
[directory]
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = true
style = 'bold fg:blue'
read_only = ' 󰌾'
read_only_style = 'fg:error'
format = '[$path]($style)[$read_only]($read_only_style) '

[directory.substitutions]
'~/Documents' = '󰈙 '
'~/Downloads' = ' '

# ── Git ──────────────────────────────────────────────────────
[git_branch]
symbol = ' '
style = 'fg:mauve'
format = 'on [$symbol$branch(:$remote_branch)]($style) '
truncation_length = 24
truncation_symbol = '…'

[git_status]
style = 'fg:warning'
format = '([$all_status$ahead_behind]($style))'
conflicted = ' '
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = 'fg:overlay'

# ── Command Duration ─────────────────────────────────────────
[cmd_duration]
min_time = 2_000
format = '[ $duration]($style) '
style = 'fg:warning'
show_notifications = true
min_time_to_notify = 30_000

# ── Username & Hostname (SSH only) ───────────────────────────
[username]
show_always = false
style_user = 'fg:accent'
style_root = 'bold fg:error'
format = '[$user]($style)[@](fg:overlay)'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'fg:accent'

# ── Languages (right prompt, auto-detected) ──────────────────
[nodejs]
symbol = ' '
format = '[$symbol$version]($style) '
style = 'fg:accent'
detect_extensions = ['js', 'mjs', 'cjs', 'ts', 'mts', 'cts']
detect_files = ['package.json', '.node-version', '.nvmrc']
detect_folders = ['node_modules']

[python]
symbol = ' '
format = '[$symbol$version( \($virtualenv\))]($style) '
style = 'fg:warning'
detect_extensions = ['py']
detect_files = ['.python-version', 'Pipfile', 'pyproject.toml', 'requirements.txt', 'setup.py', 'tox.ini']
detect_folders = ['__pycache__', '.venv', 'venv']

[rust]
symbol = ' '
format = '[$symbol$version]($style) '
style = 'fg:error'
detect_extensions = ['rs']
detect_files = ['Cargo.toml']

[golang]
symbol = ' '
format = '[$symbol$version]($style) '
style = 'fg:blue'
detect_extensions = ['go']
detect_files = ['go.mod', 'go.sum']

# ── Infrastructure (right prompt, auto-detected) ─────────────
[docker_context]
symbol = ' '
format = '[$symbol$context]($style) '
style = 'fg:blue'
only_with_files = true
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['dockerfile']

[kubernetes]
symbol = '⎈ '
format = '[$symbol$context(\($namespace\))]($style) '
style = 'fg:blue'
disabled = false
detect_files = ['k8s', 'kubernetes', 'deployment.yaml', 'deployment.yml']
detect_extensions = []
detect_folders = ['charts', 'helm']
contexts = [
  { context_pattern = '.*prod.*', style = 'bold fg:error', symbol = '⎈ ' },
  { context_pattern = '.*stag.*', style = 'fg:warning', symbol = '⎈ ' },
]

# ── Disabled Modules ─────────────────────────────────────────
[aws]
disabled = true

[time]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

[git_metrics]
disabled = true

# ── Tokyo Night Palette ──────────────────────────────────────
[palettes.tokyo_night]
# Base
bg = '#1a1b26'
fg = '#c0caf5'
overlay = '#565f89'

# Accent colors
blue = '#7aa2f7'
mauve = '#bb9af7'
accent = '#89B4FA'
warning = '#e0af68'
error = '#f7768e'
info = '#7dcfff'
